
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup your Wallet</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #08090d;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}


  top: 18px;
  right: 20px;
  color: #fcd535;
  border: 1px solid #fcd535;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
}

main {
  width: 100%;
  max-width: 1035px;
  min-height: 580px;
  background: #191b22;
  border-top: 3px solid #393443;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 302px;
  padding: 20px;
  border: 1px solid #30323a;
  border-radius: 17px;
  background: #191b22;
}

.logo {
  color: #fcd535;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
}

h1 {
  font-size: 23px;
  margin-top: 25px;
}

p {
  color: #b7b9c1;
  font-size: 11px;
  line-height: 1.6;
}

.demo-label {
  color: #fcd535;
  font-size: 10px;
  margin-top: 15px;
}

.words {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 12px;
}

.word {
  display: flex;
  align-items: center;
  background: #2b2d35;
  border: 1px solid #393b44;
  border-radius: 6px;
  padding: 9px 7px;
  min-width: 0;
}

.word span {
  color: #858791;
  font-size: 10px;
  margin-right: 6px;
}

.word input {
  width: 100%;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 10px;
}

.word input::placeholder {
  color: #858791;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 18px;
  border: 0;
  border-radius: 7px;
  background: #fcd535;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.secondary {
  background: #30323a;
  color: white;
  margin-top: 9px;
}

.message {
  display: none;
  color: #b7e4be;
  font-size: 11px;
  margin-top: 12px;
  line-height: 1.5;
}

#complete {
  display: none;
}

footer {
  font-size: 9px;
  color: #858791;
  text-align: center;
  margin-top: 15px;
}

@media(max-width: 450px) {
  main { padding: 12px; }
  .card { padding: 17px; }
}
</style>
</head>

 

<section class="card" id="backup">

<div class="logo">◆ BINANCE</div>

<h1>Backup your Wallet</h1>



<div class="demo-label">
12-Word Recovery
</div>

<div class="words" id="words"></div>

<button id="continue" disabled onclick="continue()">
Okay, I understand
</button>

<button class="secondary" onclick="reset()">
Reset fields
</button>

<div class="message" id="message"></div>



</section>

<section class="card" id="complete">

<div class="logo">◆ BINANCE</div>

<h1>Demo completed</h1>

<p>
You have successfully recovered your wallet
</p>

<button onclick="goBack()">Back</button>

</section>

</main>

<script>

// CREATE 12 EDITABLE  FIELDS
const container = document.getElementById("words");

for (let i = 1; i <= 12; i++) {
  const field = document.createElement("div");
  field.className = "word";

  field.innerHTML = `
    <span>${i}.</span>
    <input
      type="text"
      
      maxlength="24"
      autocomplete="off"
     
  container.appendChild(field);
}

// CHECK THAT ALL ENTRIES ARE FICTIONAL DEMO TEXT
function continueDemo() {
  const inputs = [...document.querySelectorAll(".word input")];

  const valid = inputs.every(input =>
    /^DEMO-[A-Z0-9]+$/i.test(input.value.trim())
  );

  const message = document.getElementById("message");

  if (!valid) {
    message.style.display = "block";
    message.textContent =
      "All 12 entries must use fictional DEMO- text.";
    return;
  }

  document.getElementById("backup").style.display = "none";
  document.getElementById("complete").style.display = "block";
}

// ENABLE BUTTON WHEN ALL FIELDS ARE COMPLETED
container.addEventListener("input", () => {
  const inputs = [...document.querySelectorAll(".word input")];

  document.getElementById("continue").disabled =
    !inputs.every(input =>
      /^DEMO-[A-Z0-9]+$/i.test(input.value.trim())
    );
});

// RESET
function resetDemo() {
  document.querySelectorAll(".word input").forEach(input => {
    input.value = "";
  });

  document.getElementById("continue").disabled = true;
  document.getElementById("message").style.display = "none";
}

// BACK
function goBack() {
  document.getElementById("complete").style.display = "none";
  document.getElementById("backup").style.display = "block";
}

</script>

</body>
</html>
